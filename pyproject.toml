[project]
name = "spin_stepper"
version = "0.1.0"
authors = [
    {name="Ulrik Södergren", email="ulrik.sodergren@luxbright.com"}
]
maintainers = [
    {name="Ulrik Södergren", email="ulrik.sodergren@luxbright.com"}
]
description = "Python interface for stepper motor drivers from the STMicroelectronics STSPIN family (L6470)."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",

]
keywords = ["L6470", "L6470HTR", "STSPIN", "STMicroelectronics", "Stepper Motor", "Raspberry Pi", "SPI"]
dependencies = [
    "spidev"
]

[project.urls]
Homepage = "https://github.com/luxbright-com/spin_stepper"


[project.optional-dependencies]
tests = [
    "pytest > 8.0",
    "pytest-timeout > 2.3"
]
dev = [
    "ruff",
    "pre-commit"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
output-format = "full"
line-length = 100

[tool.ruff.lint.pycodestyle]
max-line-length = 110

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "FA",  # flake8-future-annotations
    "N",  # pep8-naming
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]
